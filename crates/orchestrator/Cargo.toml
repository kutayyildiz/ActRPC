[package]
name = "actrpc-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.8.7"
toml = "1.1.2"
thiserror = "2.0.18"
jsonschema = "0.46.5"

actrpc-core = { path = "../core" }
actrpc-transport = { path = "../transport" }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
