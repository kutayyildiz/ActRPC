[package]
name = "actrpc-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Configuration and orchestration utilities for ActRPC."
documentation = "https://docs.rs/actrpc-orchestrator"
readme = "README.md"
keywords = ["rpc", "async", "action", "config"]
categories = ["network-programming"]

[dependencies]
actrpc-core = { path = "../core", version = "0.1.0" }
actrpc-transport = { path = "../transport", version = "0.1.0" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.8.7"
toml = "1.1.2"
thiserror = "2.0.18"
jsonschema = "0.46.5"
tokio = { version = "1.52.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }
