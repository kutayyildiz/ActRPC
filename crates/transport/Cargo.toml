[package]
name = "actrpc-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Transport abstractions and implementations for ActRPC."
documentation = "https://docs.rs/actrpc-transport"
readme = "README.md"
keywords = ["rpc", "async", "transport", "json"]
categories = ["network-programming", "asynchronous"]

[dependencies]
actrpc-core = { path = "../core", version = "0.1.0" }

thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
interprocess = { version = "2.4.2", features = ["tokio"] }
async-trait = "0.1.89"
tokio = { version = "1.52.1", features = [
  "process",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
  "rt-multi-thread",
] }

reqwest = { version = "0.13.3", default-features = false, features = [
  "json",
  "rustls",
] }
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-webpki-roots",
] }
futures-util = "0.3.32"
