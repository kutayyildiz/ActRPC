[package]
name = "actrpc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Command-line tools for ActRPC."
documentation = "https://docs.rs/actrpc-cli"
readme = "README.md"
keywords = ["rpc", "async", "action", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "actrpc"
path = "src/main.rs"

[dependencies]
actrpc-transport = { path = "../transport", version = "0.1.0" }
actrpc-core = { path = "../core", version = "0.1.0" }
actrpc-interceptor = { path = "../interceptor", version = "0.1.0" }
actrpc-orchestrator = { path = "../orchestrator", version = "0.1.0" }

tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.149"
