[package]
name = "actrpc-interceptor"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
toml = "1.1.2"
thiserror = "2.0.18"
regex = "1.12.3"
globset = "0.4.18"

actrpc-core = { path = "../core" }
actrpc-orchestrator = { path = "../orchestrator" }
tokio = { version = "1", features = ["macros", "rt"] }
